name: Pretrained model compatibility

# Real downloads and full captures are opt-in; ordinary PR tests remain offline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    name: ${{ matrix.checkpoint }} / ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [vit-tiny, tinyclip]
        mode: [cli, web, playground]
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HOME: ${{ runner.temp }}/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned compiler and model dependencies
        run: |
          python -m pip install --upgrade pip tomli
          python - <<'PY'
          import subprocess, sys, tomli
          with open('pyproject.toml', 'rb') as source:
              dependencies = tomli.load(source)['project']['dependencies']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
              '--extra-index-url', 'https://download.pytorch.org/whl/cpu', *dependencies])
          PY
      - name: Validate pinned checkpoint
        run: >-
          python scripts/validate_hf_models.py ${{ matrix.checkpoint }}
          --mode ${{ matrix.mode }} --out build/model-validation --timeout 900
      - name: Upload results, not weights or large IR dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.checkpoint }}-${{ matrix.mode }}
          path: |
            build/model-validation/validation.json
            build/model-validation/*.log
            build/model-validation/**/verification.json
          retention-days: 7
