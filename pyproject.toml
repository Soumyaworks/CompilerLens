[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compilerlens"
version = "0.2.1"
description = "Inspect model compilation and trace compiler-recorded lineage into LLVM and assembly"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "rich>=13,<16", "numpy>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "torch==2.13.0", "iree-base-compiler==3.11.0", "iree-base-runtime==3.11.0",
  "iree-turbine==3.9.0", "transformers==5.16.1", "huggingface-hub>=1,<2"
]

[project.urls]
Repository = "https://github.com/Soumyaworks/CompilerLens"
Issues = "https://github.com/Soumyaworks/CompilerLens/issues"
Documentation = "https://github.com/Soumyaworks/CompilerLens#readme"

[project.scripts]
compilerlens = "compilerlens.cli:main"

[tool.setuptools.packages.find]
include = ["compilerlens*"]
exclude = ["compilerlens._web*", "compilerlens._bin*"]

[tool.setuptools.package-data]
compilerlens = ["_bin/*", "_bin/lib/*", "_bin/licenses/*", "_web/*", "_web/assets/*"]
